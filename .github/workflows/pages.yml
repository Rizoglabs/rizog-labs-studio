name: Deploy Rizog Labs Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate frontend
        run: |
          node --check js/config.js
          node --check js/app.js
          ! grep -R -n -E "service_role|SUPABASE_SERVICE_ROLE|sb_secret_" js
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke test published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Smoke testing $PAGE_URL"
          for i in {1..20}; do
            if curl --fail --silent --show-error --location --max-time 15 "$PAGE_URL" | grep -q "Rizog Labs Studio"; then
              echo "Published site is responding correctly."
              exit 0
            fi
            echo "Waiting for Pages propagation ($i/20)..."
            sleep 3
          done
          echo "Published site smoke test failed."
          exit 1