name: Deploy Rizog Labs Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate frontend
        run: |
          node --check js/config.js
          node --check js/app.js
          ! grep -R -n -E "service_role|SUPABASE_SERVICE_ROLE|sb_secret_" js

      - name: Validate stable RizogKey manifest
        run: |
          node -e "const m=require('./engine/RIZOGKEY_ENGINE_MANIFEST.json'); if(m.engine_version!=='1.0.0'||m.protocol_version!==1||m.status!=='STABLE'||m.do_not_embed_until_engine_validation!==false) process.exit(1); console.log('RizogKey Engine 1.0.0 STABLE manifest validated.');"

      - name: Validate RizogKey Dummy App
        run: |
          node --check engine/dummy-app/app.js
          node --check engine/dummy-app/rizogkey-client.js
          test -f engine/dummy-app/index.html
          test -f engine/dummy-app/style.css
          test -f engine/dummy-app/README.md
          test -f engine/dummy-app/e2e.mjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke test published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Smoke testing $PAGE_URL"
          for i in {1..20}; do
            if curl --fail --silent --show-error --location --max-time 15 "$PAGE_URL" | grep -q "Rizog Labs Studio"; then
              echo "Published site is responding correctly."
              exit 0
            fi
            echo "Waiting for Pages propagation ($i/20)..."
            sleep 3
          done
          echo "Published site smoke test failed."
          exit 1

      - name: Smoke test Dummy App
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          DUMMY_URL="${PAGE_URL%/}/engine/dummy-app/"
          echo "Smoke testing $DUMMY_URL"
          curl --fail --silent --show-error --location --max-time 15 "$DUMMY_URL" | grep -q "Aktivasi Perangkat"
          echo "Dummy App is published."

      - name: Setup Node test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run Dummy App browser certification
        env:
          DUMMY_URL: ${{ steps.deployment.outputs.page_url }}/engine/dummy-app/
        run: node engine/dummy-app/e2e.mjs
