name: RizogCAD — Build and Test
on:
  push:
    branches: [rizogcad-converter]
    paths:
      - "RizogCAD/**"
      - ".github/workflows/rizogcad-ci.yml"
  workflow_dispatch:

concurrency:
  group: rizogcad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: RizogCAD
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8" "httpx>=0.27,<1"
      - name: Test 3-layout PDF and protected API
        working-directory: RizogCAD
        run: |
          python -m pytest test_api.py -v
          python smoke_test.py
      - name: Compile Python source
        working-directory: RizogCAD
        run: python -m compileall server.py smoke_test.py test_api.py

  cad-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LibreDWG CAD Docker image
        run: docker build --pull -f RizogCAD/Dockerfile -t rizogcad:test RizogCAD
      - name: Verify LibreDWG and server health
        run: |
          docker run --rm --entrypoint dwg2dxf rizogcad:test --version
          docker run -d --name rizogcad-ci -p 10000:10000 rizogcad:test
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:10000/api/health; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json,urllib.request
          data=json.load(urllib.request.urlopen("http://127.0.0.1:10000/api/health"))
          assert data["ready"] and data["dwg_ready"], data
          print("DWG engine ready:",data["engine"])
          PY
      - name: Container logs on failure
        if: failure()
        run: docker logs rizogcad-ci || true
      - name: Stop test server
        if: always()
        run: docker rm -f rizogcad-ci || true
